<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freeroam — prototype compare</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bar:52px}
  html,body{height:100%}
  body{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;background:#0a0a0c;color:#e9e9ee;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:10;display:flex;align-items:center;gap:16px;
    padding:0 16px;background:rgba(12,12,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}
  .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7d7d88;font-weight:600}
  .seg{display:flex;background:#17171d;border-radius:9px;padding:3px}
  .seg button{border:0;background:transparent;color:#a7a7b4;font:inherit;font-size:13px;font-weight:600;
    padding:7px 16px;border-radius:6px;cursor:pointer;transition:all .15s}
  .seg button[aria-selected="true"]{background:#fff;color:#0a0a0c}
  .hint{margin-left:auto;font-size:12px;color:#5c5c66}
  #frame{position:fixed;top:var(--bar);left:0;right:0;bottom:0;width:100%;height:calc(100% - var(--bar));border:0;background:#0b0b10}
</style>
</head>
<body>
  <div id="bar">
    <span class="lbl">Freeroam</span>
    <div class="seg" role="tablist">
      <button data-go="current" role="tab">Current</button>
      <button data-go="opal" role="tab">Opal</button>
      <button data-go="plain" role="tab">Plain</button>
    </div>
    <span class="hint">← → to switch</span>
  </div>
  <iframe id="frame" title="prototype preview"></iframe>

<script>
  const SRC={current:'../candidate/index.html',opal:'opal.html',plain:'plain.html'};
  const order=['current','opal','plain'];
  const frame=document.getElementById('frame');
  let cur='opal';
  function show(name){
    if(!order.includes(name))name='opal';
    cur=name;
    frame.src=SRC[name];
    document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.go===name));
    history.replaceState(null,'','#'+name);
  }
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')show(order[(order.indexOf(cur)+1)%order.length]);
    if(e.key==='ArrowLeft')show(order[(order.indexOf(cur)+order.length-1)%order.length]);
  });
  show(location.hash.slice(1)||'opal');
</script>
</body>
</html>
