<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freeroam — wordmark placement</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bar:48px}
  html,body{height:100%}
  body{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;background:#0a0a0c;color:#e9e9ee;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:10;display:flex;align-items:center;gap:16px;
    padding:0 16px;background:rgba(12,12,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}
  .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7d7d88;font-weight:600}
  .seg{display:flex;background:#17171d;border-radius:9px;padding:3px}
  .seg button{border:0;background:transparent;color:#a7a7b4;font:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:6px;cursor:pointer;transition:all .15s}
  .seg button[aria-selected="true"]{background:#fff;color:#0a0a0c}
  .hint{margin-left:auto;font-size:12px;color:#5c5c66}
  #frame{position:fixed;top:var(--bar);left:0;right:0;bottom:0;width:100%;height:calc(100% - var(--bar));border:0;background:#000}
</style>
</head>
<body>
  <div id="bar">
    <span class="lbl">Freeroam wordmark</span>
    <div class="seg" role="tablist">
      <button data-go="brand-a" role="tab">A · Header</button>
      <button data-go="brand-b" role="tab">B · Footer</button>
      <button data-go="brand-c" role="tab">C · Left rail</button>
    </div>
    <span class="hint">← → to switch</span>
  </div>
  <iframe id="frame" title="wordmark preview"></iframe>
<script>
  const order=['brand-a','brand-b','brand-c'];
  const frame=document.getElementById('frame');
  let cur='brand-a';
  function show(name){
    if(!order.includes(name))name='brand-a';
    cur=name;frame.src=name+'.html';
    document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.go===name));
    history.replaceState(null,'','#'+name);
  }
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')show(order[(order.indexOf(cur)+1)%order.length]);
    if(e.key==='ArrowLeft')show(order[(order.indexOf(cur)+order.length-1)%order.length]);
  });
  show(location.hash.slice(1)||'brand-a');
</script>
</body>
</html>
